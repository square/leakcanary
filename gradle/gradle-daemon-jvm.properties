# The JDK the Gradle daemon runs on, whatever JAVA_HOME says: the wrapper starts on any JVM, then looks
# for an installed JDK 17 and hands the build to it. 17 because that's what CI builds with, and a build on
# a newer JDK drifts from CI in both directions. On 21 lint passed locally and then crashed CI, because a
# Java 21 API it calls from Java 8 bytecode exists on 21 only. On 25 the Kotlin compiler and detekt refuse
# the JVM target outright, and the pre-push hook reports that as detekt violations.
#
# Written by hand rather than by `./gradlew updateDaemonJvm`, which also writes download URLs for each
# platform and so needs a toolchain download repository configured in settings.gradle. Without the URLs
# Gradle won't download a JDK 17: when none is installed, the build fails and names the version it needs.
toolchainVersion=17
