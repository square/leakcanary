<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Shark Explorer below 128 pixels: the drawing in shark-explorer-icon.svg with the gills, the
    teeth and the brow gone. Each of those is under half a pixel once the icon is 32 across, so all
    they do at that size is turn the shark grey.

    They come off by opening the traced mask - eroding it and dilating it back - which is what takes
    a thin feature off a thick one and leaves a clean jaw where the teeth were. Closing it instead,
    which is the tempting thing to reach for, seals the mouth shut and leaves the teeth as holes.

    The transform is the full drawing's rather than this one's own fit, deliberately: opening the
    silhouette shrinks it slightly, and refitting would shift the shark as the dock crossed from one
    drawing to the other.
  -->
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
