<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Shark Explorer: a shark lunging with its jaws open, in LeakCanary's yellow (#FFCC32) over a
    shaded underside (#DB8D3E), on a ground the colour of the app's slate scheme and nothing else. It
    fills the icon on purpose, so that it still reads as a shark at the size a dock shows.

    The underside is that yellow shaded rather than a second colour out of the palette. LeakCanary's
    own amber, #F5BD14, is a shade too close to be one over an area this size - it disappears, and
    the shark goes flat - and the palette's orange, #F86932, is far enough away to read as a second
    colour rather than as the same shark in shadow.

    The drawing began as a generated image, picked from a set of them, and was then traced one
    colour at a time and snapped to the palette above. None of the generated bitmap is left: what
    is here is its outlines.

    The macOS app icon grid is baked in, because jpackage ships this as an .icns and nothing masks
    or insets it for us: an 824x824 body centred in a 1024x1024 canvas, corners of extent 207 whose
    handles put the curve's 45 degree point on a superellipse rather than a circular arc, and a soft
    shadow below. Those numbers are fitted to a stock macOS icon's silhouette, within 1.5px RMS.

    The shark's transform is what makes it as large as the icon allows: it is scaled and centred so
    that the tips of the snout, the fins and the tail clear the body's edge by 34, measured against
    those superelliptical corners rather than against a bounding box, which is why the fin can come
    as close to the top as it does.

    shark-explorer-icon-small.svg is this drawing again with the detail that is thinner than a pixel
    at 32 across taken out. Both are rasterised by ./render-icons.sh, which picks between them by
    size, so a change to one of them usually wants the same change in the other.
  -->
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <path d="M 307 100 H 717 C 852.5 100 924 171.5 924 307 V 717 C 924 852.5 852.5 924 717 924 H 307 C 171.5 924 100 852.5 100 717 V 307 C 100 171.5 171.5 100 307 100 Z" fill="#1B2428" filter="url(#shadow)"/>
